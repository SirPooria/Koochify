<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#grad)" />
  <!-- Compass Circle -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9" />
  <!-- Compass Needle North (Bright Cyan/White) -->
  <polygon points="32,16 38,32 32,28" fill="#ffffff" />
  <!-- Compass Needle South (Dark Slate) -->
  <polygon points="32,48 38,32 32,28" fill="#0f172a" opacity="0.75" />
  <polygon points="32,48 26,32 32,28" fill="#1e293b" opacity="0.85" />
  <polygon points="32,16 26,32 32,28" fill="#e2e8f0" />
  <!-- Center Pivot Pin -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
  <circle cx="32" cy="32" r="1.5" fill="#059669" />
</svg>
